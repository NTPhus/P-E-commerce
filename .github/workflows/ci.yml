name: Phase 0 CI
on:
  push:
    branches: [ phase0-skeleton, main ]
  pull_request:
    branches: [ phase0-skeleton, main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          npm install
      - name: TypeScript Compile
        run: |
          npm run -s build || true
      - name: Run TypeScript Lint (if configured)
        run: |
          npm run -s lint || true
