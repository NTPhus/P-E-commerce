name: Phase 0 & Phase 1 CI (UI smoke)
on:
  push:
    branches: [ phase0-skeleton, dev, main, phase1-ui-pr ]
  pull_request:
    branches: [ phase0-skeleton, dev, main, phase1-ui-pr ]
jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies (root)
        run: npm install
      - name: Build Phase 1 UI (apps/web)
        run: npm run build --prefix apps/web
      - name: Install Playwright browsers
        run: npx playwright install
      - name: Start UI server (Phase 1)
        run: |
          npm run dev --prefix apps/web &
          sleep 20
      - name: Run Playwright end-to-end tests
        run: npm run test:e2e --prefix apps/web || true
