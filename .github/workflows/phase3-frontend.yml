name: Phase 3 Frontend CI

on:
  push:
    branches: [dev, phase3-frontend]
    paths:
      - 'apps/web/**'
  pull_request:
    branches: [dev]
    paths:
      - 'apps/web/**'

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies (frontend)
        working-directory: apps/web
        run: npm ci
      - name: Build frontend
        working-directory: apps/web
        run: npm run build
      - name: (Optional) Lint
        if: false
        run: echo "Lint step skipped in skeleton"
