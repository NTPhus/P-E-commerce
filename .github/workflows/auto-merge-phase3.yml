name: Auto Merge Phase 3 Frontend PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'dev' && contains(join(github.event.pull_request.labels.*.name, ','), 'ready-for-merge')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto Merge PR
        uses: peter-evans/merge-pull-request@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          merge-method: squash
          required-status-checks: "Phase 3 Frontend CI"
          # Optional: avoid auto-merge of drafts
          # draft: false
