name: Auto Create Phase 3 PRs

on:
  push:
    branches:
      - phase3-catalog
      - phase3-cart
      - phase3-checkout

jobs:
  create_catalog_pr:
    runs-on: ubuntu-latest
    if: github.event.ref == 'refs/heads/phase3-catalog'
    steps:
      - uses: actions/checkout@v4
      - name: Create PR Catalog
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: dev
          head: phase3-catalog
          title: "feat(phase3): Catalog milestone"
          body: "Phase 3 Catalog milestone: implement catalog UI with search, filters, and product cards."
          labels: phase3 milestone/catalog
          draft: false

  create_cart_pr:
    runs-on: ubuntu-latest
    if: github.event.ref == 'refs/heads/phase3-cart'
    steps:
      - uses: actions/checkout@v4
      - name: Create PR Cart
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: dev
          head: phase3-cart
          title: "feat(phase3): Cart milestone"
          body: "Phase 3 Cart milestone: implement cart with add/remove items, totals, and persistence."
          labels: phase3 milestone/cart
          draft: false

  create_checkout_pr:
    runs-on: ubuntu-latest
    if: github.event.ref == 'refs/heads/phase3-checkout'
    steps:
      - uses: actions/checkout@v4
      - name: Create PR Checkout
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: dev
          head: phase3-checkout
          title: "feat(phase3): Checkout milestone"
          body: "Phase 3 Checkout milestone: implement checkout flow with address, payment method, and order confirmation."
          labels: phase3 milestone/checkout
          draft: false
